# ---- batch of 2026-10-30: the six Easy powers left from
# docs/briefs/sorting-2026-10-30.md (Marin the Manager and Buttons wait for
# the trinket frame). Armor and card_id from ref/bg-meta.json.

# The next Tavern spell you buy costs (1) less. (Unlocks on Turn 3.)
[[hero]]
name = "Exarch Othaar"
card_id = "BG31_HERO_006"
armor = 15
power = { name = "Arcane Knowledge", card_id = "BG31_HERO_006p", unlock_turn = 3, effect = { spell_discount = 1 } }

# Trigger a friendly minion's Battlecry. (Unlocks on Turn 3.)
[[hero]]
name = "Shudderwock"
card_id = "TB_BaconShop_HERO_23"
armor = 10
power = { name = "Snicker-snack", card_id = "TB_BaconShop_HP_022", unlock_turn = 3, effect = { trigger_battlecry = true } }

# Discard a card to get a random Aberration.
[[hero]]
name = "Drest'agath"
card_id = "BG36_HERO_000"
armor = 12
tribes = ["aberration"]
power = { name = "Incubate", card_id = "BG36_HERO_000p", cost = 1, effect = { discard_get_random_minion = "aberration" } }

# Get 2 random minions. When you play one, discard the other.
[[hero]]
name = "Kith'ix"
card_id = "BG36_HERO_002"
armor = 8
power = { name = "Dark Ritual", card_id = "BG36_HERO_002p", cost = 2, effect = { get_linked_minions = 2 } }

# Get a random Tavern spell.
[[hero]]
name = "Doctor Holli'dae"
card_id = "BG28_HERO_801"
armor = 14
power = { name = "Blessing of the Nine Frogs", card_id = "BG28_HERO_801p", cost = 1, effect = { get_random_spell = true } }

# Refresh the Tavern with Tavern spells.
[[hero]]
name = "Time Twister Chromie"
card_id = "BG34_HERO_001"
armor = 14
power = { name = "Mana Per Minute", card_id = "BG34_HERO_001p", effect = { refresh_with_spells = true } }

# ---- the two powers that are a trinket offer (2026-10-30, with the trinket
# frame). The pick turns the power into the trinket, so it has no button; the
# normal lesser and greater offers still come on turns 6 and 9.

# On Turn 5, choose a Lesser Trinket to buy.
[[hero]]
name = "Marin the Manager"
card_id = "BG30_HERO_304"
armor = 12
power = { name = "Fantastic Treasure", card_id = "BG30_HERO_304p", passive = true, unlock_turn = 5, effect = { trinket_offer = "lesser" } }

# On Turn 8, choose a Greater Trinket to buy.
[[hero]]
name = "Buttons"
card_id = "BG32_HERO_002"
armor = 16
power = { name = "Growing Collection", card_id = "BG32_HERO_002p", passive = true, unlock_turn = 8, effect = { trinket_offer = "greater" } }

# ---- batch of 2026-10-31: hero frame 2 (docs/briefs/heroes-frame2.md): the
# two powers, the powers that turn into others, and the skipped turns. A power
# a hero only reaches later is a `[[power]]` entry of its own, and a `[[hero]]`
# power can name the powers it turns into (`choose`, `becomes`).

# King of Duality: on turn 4, Discover two Hero Powers. The first pick is the
# SECOND power and the second pick the MAIN one (docs/heroes.md).
[[hero]]
name = "Genn, Worgen King"
card_id = "BG35_HERO_001"
armor = 7
power = { name = "King of Duality", card_id = "BG35_HERO_001p", cost = 0, once_per_game = true, unlock_turn = 4, effect = { discover_powers = 2 } }

# BUY, INSECT!: after 12 bought cards the power becomes Sulfuras, which fires
# at the end of that same turn.
[[hero]]
name = "Ragnaros the Firelord"
card_id = "TB_BaconShop_HERO_11"
armor = 15
power = { name = "BUY, INSECT!", card_id = "TB_BaconShop_HP_087", passive = true, effect = { buy_milestone = 12, becomes = "TB_BaconShop_HP_087t" } }

[[power]]
name = "Sulfuras"
card_id = "TB_BaconShop_HP_087t"
passive = true
effect = { end_of_turn_ends = [8, 8] }

# Embrace the Elements: choose one of the four Invocations; it fires at the
# next Start of Combat and then the chooser comes back.
[[hero]]
name = "Bru'kan"
card_id = "BG22_HERO_001"
armor = 15
power = { name = "Embrace the Elements", card_id = "BG22_HERO_001p", effect = { choose = true }, choose = [
    "BG22_HERO_001p_t1",
    "BG22_HERO_001p_t2",
    "BG22_HERO_001p_t3",
    "BG22_HERO_001p_t4",
] }

[[power]]
name = "Earth Invocation"
card_id = "BG22_HERO_001p_t1"
passive = true
returns_to = "BG22_HERO_001p"
effect = { soc_grant_deathrattle = 4, card = "Stone Elemental" }

[[power]]
name = "Fire Invocation"
card_id = "BG22_HERO_001p_t2"
passive = true
returns_to = "BG22_HERO_001p"
effect = { soc_double_left_attack = 1 }

[[power]]
name = "Water Invocation"
card_id = "BG22_HERO_001p_t3"
passive = true
returns_to = "BG22_HERO_001p"
effect = { soc_rightmost = ["divine_shield", "taunt"] }

[[power]]
name = "Lightning Invocation"
card_id = "BG22_HERO_001p_t4"
passive = true
returns_to = "BG22_HERO_001p"
effect = { soc_damage_enemies = { hits = 5, damage = 1 } }

# Dungar's Gryphon: choose one of three flightpaths; each completes after the
# turns its card names, gives its bonus, and the chooser comes back without the
