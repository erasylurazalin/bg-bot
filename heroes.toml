# The built heroes (DESIGN.md "Heroes"). Stats, armor and tribe ties are from
# ref/bg-meta.json, matched by card_id, never by name. A power is data here:
# passive = true means no button; uses_per_turn, once_per_game, unlock_tier
# and unlock_turn are the button's limits; effect is what it does. Later
# batches append entries here; the engine never matches a hero by name.

