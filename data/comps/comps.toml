# The comp library the planner bot plays (docs/briefs/comp-planner-1.md).
#
# The ten comps are JeefHS's current-patch HSReplay guides
# (docs/notes/comps/hsreplay-2026-11-09.json), chosen by Era on 2026-11-09:
# the easy or S-tier comps whose commit is a card, plus Murlocs - Venom Scam
# as the fallback. The APM and infinite-gold comps wait.
#
# Every card is named as cards.toml names it. The loader rejects a name that
# cards.toml does not hold, and a hero or trinket that heroes.toml or
# trinkets.toml does not hold. Change the file and rerun: no rebuild needed.
#
# Format, one [[comp]] per comp:
#   name         the comp's name, unique, the target of a give_up
#   tribes       the card tribes the comp plays (for target and Discover
#                preference); empty for a comp with no tribe
#   lobby        every tribe the comp needs in the lobby; empty means any
#                lobby. The overlay and planner only use the comp when all of
#                them are there (Menagerie: none; Mechs needs Quilboar too
#                for its Blood Gem spell cycle)
#   draft        true while Era has not corrected the entry
#   fallback     true when the planner may pick it late with no other comp
#   commit_turn  [first, last] turn the planner may commit on a signal
#   level        the tier target for turn 1, 2, ...; absent inherits
#                [defaults], and level = [] means the comp has no curve
#   scales       "none", "beetles" or "stats": the player-wide counter that
#                makes the comp grow (beetles reads Player.beetle_bonus)
#
# core: name, weight, scale. The weight is what the card is worth on the final
# board; scale = true means the card's own growth (improvements,
# Magnetizations, Golden) is worth extra progress. The guide's core cards are
# the payoffs.
#
# enabler: a list of alternatives. Each one is `all = [[...], [...]]`: every
# group must have one of its cards on the board or in the hand, and a group
# with several names is an either/or. One entry has to be complete for the
# comp to be ACTIVE. Several entries are the guide's several commit
# alternatives. The guide's when-to-commit text is the enabler; the common
# enabler line is used only when it adds something the commit text does not
# say (noted per comp).
#
# payoff, filler: the overlay's cards. A payoff is worth a purchase/play bonus
# B, a filler B/2. The overlay masks selling an enabler or a payoff.
#
# [comp.early] cards and strong_stats: what keeps the comp alive before it
# comes together.
#
# signals: weight, plus one of: cards (a list, one point per distinct card
# seen on the board, in hand or in the Tavern), tribe + min_count, hero,
# trinket, keyword. These are the planner's commit reasons.
#
# abort: the comp's enabler no longer activates it once the threshold turn has
# passed (`after_turn`, checked as turn > after_turn) or the player has reached
# `min_tier`, with no enabler held. Both are one-way. Only where the guide
# says a latest turn (Demons - Deathrattle/Shop Buff, turn 6) and Era's Self
# Damage rule (Tier 3 without an enabler).
#
# [comp.give_up] after_turn, progress_below, to: the comp is dropped after
# that turn when its progress is below that number.
#
# not_in_comp: cards that look good but are sold first (the Balinda rule).

[defaults]
# The default curve, the standard bot's. Era's timing from
# docs/notes/mining/sure-plays.md is tier 2 on turn 2, tier 3 on turn 5,
# tier 4 on turn 6, tier 5 on turn 8 when affordable; it measured 7.27
# against 7.02 for this curve on the 512-game test, so a comp that wants it
# can set it here (or set its own `level`). dying_health is the Health at or
# below which no level is taken.
level = [1, 2, 2, 2, 3, 3, 4, 4, 4, 4, 5, 6]
dying_health = 10
# Era's Health-loss rule (docs/notes/era-strategy.md "Taking damage on your
# own turn"): a large negative bonus, not a mask, for any action that costs
# Health on the player's own turn while no Soul Rewinder or Ashen Corruptor
# is on the board. Applies to every comp and card.
health_loss_penalty = -10.0

[[comp]]
name = "Beasts - Tasty Lobstah"
tribes = ["beast"]
lobby = ["beast"]
draft = true
fallback = false
commit_turn = [4, 12]
scales = "none"
enabler = [
  { all = [["Headhunter Gryphon"], ["Deathstrider"]] },
]
payoff = ["Titus Rivendare", "Tasty Lobster", "Headhunter Gryphon", "Deathstrider"]
filler = ["Sin'dorei Straight Shot", "Lurking Lionfish", "Hoarding Hyena"]
core = [
  { name = "Titus Rivendare", weight = 6.0, scale = false },
  { name = "Tasty Lobster", weight = 10.0, scale = true },
  { name = "Headhunter Gryphon", weight = 4.0, scale = false },
  { name = "Deathstrider", weight = 8.0, scale = false },
]
early = { cards = ["Lurking Lionfish", "Hoarding Hyena"], strong_stats = true }
signals = [
  { cards = ["Tasty Lobster"], weight = 6.0 },
  { cards = ["Headhunter Gryphon", "Deathstrider"], weight = 4.0 },
  { cards = ["Titus Rivendare"], weight = 3.0 },
]
not_in_comp = []

