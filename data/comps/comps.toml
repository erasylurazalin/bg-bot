[[comp]]
name = "Demons - Self Damage"
tribes = ["demon"]
lobby = ["demon"]
draft = true
fallback = false
commit_turn = [2, 6]
# Era's abort rule: reached Tier 3 without an enabler.
abort = { min_tier = 3 }
scales = "none"
# Era: Soul Rewinder (the turns 3 to 5 enabler) and Ashen Corruptor both
# count, each needing a self-damage card with it: a Soul Rewinder alone is just
# a tier 2 Demon, and activating on it alone ran the comp in a quarter of all games.
enabler = [
  { all = [["Soul Rewinder"], ["Wrath Weaver"]] },
  { all = [["Ashen Corruptor"], ["Wrath Weaver", "Malchezaar, Prince of Dance"]] },
]
payoff = ["Ashen Corruptor", "Balinda Stonehearth", "Eredar Escapist", "Devilish Distractor", "Brann Bronzebeard"]
filler = ["Tichondrius", "Malchezaar, Prince of Dance", "Wrath Weaver"]
core = [
  { name = "Ashen Corruptor", weight = 10.0, scale = false },
  { name = "Balinda Stonehearth", weight = 6.0, scale = false },
  { name = "Eredar Escapist", weight = 9.0, scale = false },
  { name = "Devilish Distractor", weight = 8.0, scale = false },
  { name = "Brann Bronzebeard", weight = 5.0, scale = false },
]
early = { cards = ["Wrath Weaver", "Malchezaar, Prince of Dance", "Tichondrius"], strong_stats = true }
signals = [
  { cards = ["Soul Rewinder"], weight = 6.0 },
  { cards = ["Ashen Corruptor"], weight = 6.0 },
  { cards = ["Eredar Escapist"], weight = 4.0 },
  { cards = ["Devilish Distractor"], weight = 3.0 },
  { cards = ["Wrath Weaver"], weight = 2.0 },
]
not_in_comp = []

