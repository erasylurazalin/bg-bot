# Test-only cards for the phase D1a systems (five tribes, multi-tribe cards,
# Activate, Bonus Keywords and Stealth, consuming Tavern minions, Tavern buffs,
# event counters, hero health). None of these are in cards.toml. Used with
# v01-rules.toml, which carries the bonus keyword list and the health rules.
#
# Most are tier 1 so a roll in a test draws from this list at tier 1.

