# The Dark Gifts (docs/rules/darkgifts.md, Era's rules). One [[gift]] per gift card
# of the game data (`ref/bg-meta.json` `dark_gifts`): its card_id, its name,
# the turn window it can be offered in (game tags 4853 and 4854), its weight
# (4856, 50 means half as likely to be picked for an offer) and the condition
# its host has to meet. `repeats = true` on a countdown gift means the gift
# stays on the minion and starts its count again after paying out. What a gift
# *does* is a token in cards.toml's "Dark Gifts" section (`card = "<token
# name>"`), so a gift whose text matches a card's runs through exactly the same
# code as that card.
#
# The engine never matches a gift by name. Windows, weights, conditions and
# `repeats` are read here; `crates/bgcore/src/darkgifts.rs` holds the loader
# and the offer rules.

# The pool the Dark Discovery draws its minions from (docs/rules/darkgifts.md).
# On top of these: never a Magnetic minion, never one with a "when you sell
# this", never one whose effect works in hand. Those are flags on the card,
# not names here.
[pool]
# No Battlecry and no Choose One minion before this turn.
no_battlecry_before = 5
no_choose_one_before = 5
# Left out for balance, by card name (cards.toml names).
# The five Dark Paradox versions are left out too (docs/rules/darkgifts.md "Dark
# Paradox"): the card the pool does hold never shows up with a gift.
exclude = [
    "Leeroy the Reckless",
    "Deadly Spore",
    "Dark Paradox t3",
    "Dark Paradox t4",
    "Dark Paradox t5",
    "Dark Paradox t6",
    "Dark Paradox t9",
]

# The tiers of the three offers by turn, and whether that slot wants a minion
# of the player's most common type. Several tiers in one slot ("4,5") are
# picked among at random. The last entry covers every later turn. Before the
# first entry the button is locked.
[[offer]]
turn = 3
tiers = ["2", "2", "2"]
yours = [false, false, false]

[[offer]]
turn = 4
tiers = ["2", "2", "3"]
yours = [false, false, false]

[[offer]]
turn = 5
tiers = ["3", "3", "3"]
yours = [false, false, false]

[[offer]]
turn = 6
tiers = ["3", "4", "4"]
yours = [true, false, false]

[[offer]]
turn = 7
tiers = ["4", "4", "4"]
yours = [true, true, false]

[[offer]]
turn = 8
tiers = ["4", "5", "5"]
yours = [true, true, false]

[[offer]]
turn = 9
tiers = ["4,5", "5", "6"]
yours = [true, true, false]

[[offer]]
turn = 10
tiers = ["5", "5,6", "5,6"]
yours = [true, true, false]

# --- Steady Growth's numbers -------------------------------------------
# "At the end of your turn, gain +{1}/+{2}": both are fixed when the gift
# lands, by the turn it was offered. The log shows +2/+2 on turn 3, +2/+3 on
# turn 4 and +3/+4 on turn 5 (docs/briefs/darkgift-facts.md section 3k), so
# Attack goes up by one every two turns from turn 3 and Health by one every
# turn. Past turn 5 that is extrapolated one step per turn (6: +3/+5,
# 7: +4/+6, 8: +4/+7) and capped at +10/+20.
[steady_growth]
base_attack = 2
base_health = 2
base_turn = 3
attack_every = 2
health_every = 1
max_attack = 10
max_health = 20

