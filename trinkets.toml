# The built trinkets (docs/rules/design.md "Trinkets and Dark Gifts (2026-10-30)",
# docs/engine.md "Trinkets", how to add one in docs/adding-cards.md).
#
# One entry per trinket: name, card_id, slot ("lesser" or "greater"), cost
# (0 or left out means free: the game data has no price), the lobby tribes it
# belongs to (`lobby_subsets` in ref/bg-meta.json; a trinket with a tribe is
# only offered when that tribe is in the lobby), and its effects. The effect
# keys are the same keys cards.toml uses wherever a card has the same effect
# (`get`, `get_gems`, `gem_bonus`, `cast`, ...); `crates/bgcore/src/trinkets.rs`
# lists every key. The hook lists are where a trinket listens:
#
#   on_pick, start_of_turn, end_of_turn   the frame's own clock
#   on_buy (+ buy_tribe), on_buy_spell, on_play (+ play_tribe), on_sell,
#   on_refresh, on_cast_spell (a Tavern spell), on_any_spell (any spell at
#   all: a Blood Gem, Gem Day, a Banana, a Spellcraft spell),
#   on_cast_spell_on_minion, on_discard
#   (+ discard_spells_only, discard_minions_only), on_get (+ get_tribe,
#   "whenever you get a <tribe>"), rule = { event, every, once, acts }
#   uses_per_turn (caps the hook lists), start_every (the start-of-turn list
#   only every N turns), fight = [{ when, ... }] (in a fight)
#
# `cube = false` keeps a trinket out of the Mystery Cube's offers: the ones
# whose whole effect is spent when you get it (a card or two into the hand, a
# payout of Gold, one moved offer) and the ones that replace themselves on the
# pick (Orb of the Unknown, Quartermaster's Hook). The list is a guess until
# Era rules on it (docs/rules/design.md "Some trinkets are never offered by the cube").
#
# Effect keys with no card behind them: upgrade_discount, buff_tavern_this_turn,
# make_golden_random, last_spell_copies, discover_deathrattle, discover_tier,
# discover_remember / get_remembered, copy_buys, gems_each_type,
# buff_leftmost, get_golden, lockbox_sooner, magnetize_ends, one_of,
# warband_whistle, triple_need_two_pirate, lock_type, golden_bought.

#
# Second round (2026-10-31): prices and Gold. `health_price_minions`,
# `health_price_highest_tier`, `every_nth_buy_health` and `health_price_spell`
# make a buy cost Health (self damage, never Gold spent); `free_buys` and
# `free_tribe_buys` make a buy free (still a buy); `gold_on_tier6`,
# `gold_per_type`, `gold_per_golden` and `golden_when_rich` pay out on their
# own. The slots: `next_trinket_lesser`, `greater_offer_in` (a turn count from
# now), `greater_offer_into_lesser` (Trip Vouchers), `offer_replace` (Mystery
# Cube) and `replace_with_random` (Orb of the Unknown, Quartermaster's Hook).
# `on_gold_spent` fires once per spending whatever the amount. The `rule`
# events follow the same split: `cast_spell` is a Tavern spell, `spell_cast`
# is any spell (docs/rules/design.md "Read the card's exact words, every time").
# `grow_value` plus `buff_all_growing`/`buff_leftmost_growing` are the
# "improve this" cards, and `buff_all_per_golden`/`buff_leftmost_two_per_battlecry`
# read the game-long counters. `buff_random_other` is done in the shop by the
# trinket frame (the card path only has the fight version).

