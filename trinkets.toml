#
# Fight-side trinkets (block 1). A trinket has no host minion, so these are
# the `fight = [{ when = ..., ... }]` tables: the fight builds a small bundle
# from the slots (`Player::counters` -> `Counters.trinkets`,
# `crates/bgcore/src/fight.rs`) and runs the acts at its own hook points.
# `when` is "soc" (Start of Combat), "avenge", "summon", "attack", "death",
# "reborn" or "awaken"; `tribe`/`neutral`/`rally` filter the minion a trigger
# is about, and pick the minions a Start of Combat or Avenge effect reaches
# (`pick = "all" | "ends" | "random" | "lowest_attack" | "rally" | "card"`).
# A rule whose event is "death", "summon", "death_<tribe>" or "summon_<tribe>"
# counts those fight events in the shop counter as well (DESIGN.md: shop
# deaths count for death counters).

# ---- the frame's proof: one Avenge, one Start of Combat, one summon ----

[[trinket]]
name = "Quilligraphy Set"
card_id = "BG30_MagicItem_410"
slot = "lesser"
tribes = ["quilboar"]
fight = [{ when = "avenge", every = 3, gem_bonus = [0, 1] }]

