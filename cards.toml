# Cards for v0.1, made up and loosely modelled on real ones. See DESIGN.md.
#
# stats = [attack, health]
# keywords: taunt, divine_shield, windfury, venomous, reborn
# battlecry: { buff = [attack, health], target = "chosen" | "others", tribe = ... }
#   chosen: the player picks one other friendly minion
#   others: every other friendly minion
#   tribe limits the targets, leave it out for any minion
# deathrattle: { summon = "<token name>", count = n }
#
# Golden: double stats, buffs doubled, summoned tokens golden.

