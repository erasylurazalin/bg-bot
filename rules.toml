# The rules. See DESIGN.md, Part 2. Board 7, hand 10, shop 6 and
# 8 players are fixed in the code, because the action space and the
# observation layout depend on them.

starting_health = 30
first_turn_gold = 3
max_gold = 10
buy_cost = 3
sell_gold = 1
roll_cost = 1

# Cost to go from tier 1 to 2, 2 to 3, ... 5 to 6. Goes down by 1 at the
# start of every turn, to 0.
upgrade_costs = [5, 7, 8, 11, 10]
shop_sizes = [3, 4, 4, 5, 5, 6]
# Tier 7 has the same count as tier 6 (a guess, Blizzard doesn't show it).
copies_per_tier = [16, 15, 13, 11, 9, 7, 7]

# Damage to a hero is capped by turn. Past the last entry the cap is
# late_damage_cap, and with uncapped_at_players or fewer alive there is no
# cap at all.
damage_caps = [
    { through_turn = 4, cap = 5 },
    { through_turn = 7, cap = 10 },
]
late_damage_cap = 15
uncapped_at_players = 4

max_turns = 40
max_actions_per_turn = 60
max_attacks = 500

# Heroes each player is offered before turn 1 (a free account; the Battle
# Pass gives 4 and a reroll, which we skip). At most DISCOVER options.
hero_choices = 2

# Health a Refresh costs when a card makes it cost Health instead of Gold.
health_refresh_cost = 1

# Trinkets (DESIGN.md "Trinkets and Dark Gifts"). The lesser trinket is
# offered at the start of this turn and the greater one at the start of that
# turn. A tribe with `trinket_lesser_need` minions on your board (Murlocs
# count in hand too) is guaranteed a trinket of that tribe, and its trinkets
# keep their price; a tribe trinket that falls short costs
# `trinket_discount` less. The other options are drawn with these weights:
# neutral trinkets, trinkets of a tribe you have, trinkets of another lobby
# tribe, plus `trinket_offer_mechanic` for one matching your board's
# mechanics (Battlecry, Deathrattle, spells cast).
trinket_lesser_turn = 6
trinket_greater_turn = 9
trinket_lesser_need = 2
trinket_greater_need = 3
trinket_discount = 2
trinket_offer_neutral = 50
trinket_offer_own = 42
trinket_offer_other = 7
trinket_offer_mechanic = 20

# The Bonus Keywords: what "gain a random Bonus Keyword" picks from and what
# "different Bonus Keywords in your warband" counts. Magnetic is a keyword
# but not a Bonus Keyword.
bonus_keywords = ["taunt", "divine_shield", "windfury", "venomous", "reborn", "stealth"]
